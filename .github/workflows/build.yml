name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q OtimizadorPro.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: cd OtimizadorPro && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OtimizadorPro-apk
          path: OtimizadorPro/app/build/outputs/apk/debug/*.apk
